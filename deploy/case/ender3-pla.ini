# PrusaSlicer profile mirroring the Ender 3's proven Creality Print settings (Klipper, Bowden, PLA)
printer_technology = FFF
gcode_flavor = klipper
bed_shape = 0x0,235x0,235x235,0x235
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_type = PLA
temperature = 200
first_layer_temperature = 200
bed_temperature = 60
first_layer_bed_temperature = 60
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
infill_every_layers = 1
external_perimeters_first = 0
perimeter_speed = 50
external_perimeter_speed = 40
infill_speed = 50
solid_infill_speed = 50
top_solid_infill_speed = 40
first_layer_speed = 20
travel_speed = 120
bridge_speed = 30
gap_fill_speed = 30
retract_length = 6
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_before_travel = 2
wipe = 0
skirts = 1
skirt_distance = 6
skirt_height = 1
brim_width = 0
support_material = 0
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1
extrusion_multiplier = 1
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
machine_max_acceleration_extruding = 3000
machine_max_acceleration_travel = 3000
default_acceleration = 1500
first_layer_acceleration = 500
complete_objects = 0
gcode_comments = 0
# The printer has no [exclude_object], so no object labels
gcode_label_objects = disabled
# Start: exactly the routine of the printer's last successful job (heat, home, two priming lines)
start_gcode = G90 ; use absolute coordinates\nM83 ; extruder relative mode\nM140 S[first_layer_bed_temperature] ; set final bed temp\nM104 S150 ; set temporary nozzle temp to prevent oozing during homing\nG4 S10 ; allow partial nozzle warmup\nG28 ; home all axis\nG1 Z50 F240\nG1 X2 Y10 F3000\nM104 S[first_layer_temperature] ; set final nozzle temp\nM190 S[first_layer_bed_temperature] ; wait for bed temp to stabilize\nM109 S[first_layer_temperature] ; wait for nozzle temp to stabilize\nG1 Z0.28 F240\nG92 E0\nG1 Y140 E10 F1500 ; prime the nozzle\nG1 X2.3 F5000\nG92 E0\nG1 Y10 E10 F1200 ; prime the nozzle\nG92 E0
end_gcode = G1 Z{min(max_layer_z+2, max_print_height)} F600 ; move head up\nG1 X5 Y188 F7200 ; present print\nG1 Z{min(max_layer_z+70, max_print_height-10)} F600\nM140 S0 ; turn off heatbed\nM104 S0 ; turn off hotend\nM107 ; turn off fan\nM84 X Y E ; disable motors
use_relative_e_distances = 1
