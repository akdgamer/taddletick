[project]
name = "project-tracker-backend"
version = "0.1.0"
description = "Project tracker API (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
